[workspace]
resolver = "3"
members = ["crates/slopclient-core", "crates/slopclient-cli", "crates/slopclient-cosmetics", "launcher/src-tauri"]

[workspace.package]
version = "0.5.5"
edition = "2024"

[workspace.dependencies]
slopclient-core = { path = "crates/slopclient-core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
md5 = "0.7"
dunce = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
anyhow = "1"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_NetworkManagement_Dns", "Win32_Storage_FileSystem"] }
