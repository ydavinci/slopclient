# docker compose up -d   (next to a .env with SLOPCLIENT_COSMETICS_ADMIN_TOKEN=...)
services:
  cosmetics:
    image: ghcr.io/ydavinci/slopclient-cosmetics:latest
    # `docker compose up -d --build` builds from this checkout instead (server, web page
    # and its 3D preview), e.g. for changes that are not in a release yet.
    build:
      context: ../..
      dockerfile: deploy/cosmetics/Dockerfile
    restart: unless-stopped
    environment:
      SLOPCLIENT_COSMETICS_PUBLIC_URL: https://cosmetics.example.com
      SLOPCLIENT_COSMETICS_ADMIN_TOKEN: ${SLOPCLIENT_COSMETICS_ADMIN_TOKEN:-}
      # Requests arrive from Caddy: rate limits use the client address it forwards.
      SLOPCLIENT_COSMETICS_TRUST_PROXY: "1"
    volumes:
      - cosmetics-data:/data
    # Only on localhost: Caddy (Caddyfile next to this file) terminates HTTPS in front of it.
    ports:
      - 127.0.0.1:8787:8787

volumes:
  cosmetics-data:
