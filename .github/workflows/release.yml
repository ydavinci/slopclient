name: Release

# Tag push (v0.2.0, v0.3.0-beta.1, ...) builds everything and publishes a GitHub release.
# Manual run builds everything and only uploads the workflow artifacts (dry run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Defaults baked into launcher and CLI at build time (option_env! in slopclient-core/src/config.rs).
  SLOPCLIENT_MSA_CLIENT_ID: ${{ vars.SLOPCLIENT_MSA_CLIENT_ID }}
  SLOPCLIENT_COSMETICS_URL: ${{ vars.SLOPCLIENT_COSMETICS_URL }}
  SLOPCLIENT_DISCORD_APP_ID: ${{ vars.SLOPCLIENT_DISCORD_APP_ID }}
  SLOPCLIENT_CURSEFORGE_API_KEY: ${{ secrets.SLOPCLIENT_CURSEFORGE_API_KEY }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check that all manifests agree on the version
        run: |
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          gradle=$(sed -n 's/^version=//p' client-mod/gradle.properties)
          tauri=$(jq -r .version launcher/src-tauri/tauri.conf.json)
          npm=$(jq -r .version launcher/package.json)
          echo "Cargo=$cargo Gradle=$gradle Tauri=$tauri npm=$npm"
          for v in "$gradle" "$tauri" "$npm"; do
            [ "$v" = "$cargo" ] || { echo "::error::Versions differ between manifests"; exit 1; }
          done
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $cargo"; exit 1
          fi
          echo "version=$cargo" >> "$GITHUB_OUTPUT"

  client-mod:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: client-mod
          path: |
            client-mod/build/libs/slopclient-*.jar
            !client-mod/build/libs/*-sources.jar
          if-no-files-found: error
      # Separate artifact: the launcher build embeds whatever jar lies in client-mod/build/libs.
      - uses: actions/upload-artifact@v4
        with:
          name: cosmetics-mod
          path: |
            client-mod/cosmetics/build/libs/slopclient-cosmetics-mod-*.jar
            !client-mod/cosmetics/build/libs/*-sources.jar
          if-no-files-found: error

  launcher:
    needs: client-mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # slopclient-core/build.rs embeds the mod jar from client-mod/build/libs.
      - uses: actions/download-artifact@v4
        with:
          name: client-mod
          path: client-mod/build/libs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: launcher
      - run: npm ci
        working-directory: launcher
      # The updater only installs files signed with this key (public key in tauri.conf.json).
      # Releases must be signed; a dry run without the secret builds without updater files.
      - name: Build launcher
        working-directory: launcher
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Releases must be signed for the launcher updater (see RELEASING.md)."
            exit 1
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, building without updater signature (dry run only)."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Build CLI
        run: cargo build --release --locked -p slopclient-cli
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*-setup.exe dist/
          cp target/release/bundle/nsis/*-setup.exe.sig dist/ 2>/dev/null || [ "$GITHUB_REF_TYPE" != "tag" ]
          cp target/release/slopclient.exe dist/slopclient-cli-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: dist/*
          if-no-files-found: error

  cli:
    needs: client-mod
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-mod
          path: client-mod/build/libs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli
      - run: cargo build --release --locked -p slopclient-cli
      - run: |
          mkdir dist
          tar -czf dist/slopclient-cli-${{ matrix.name }}.tar.gz -C target/release slopclient
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  cosmetics-server:
    needs: client-mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-mod
          path: client-mod/build/libs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cosmetics
      - run: cargo test --release --locked -p slopclient-cosmetics
      - run: cargo build --release --locked -p slopclient-cosmetics
      - name: Package with service file, Caddyfile and README
        run: |
          pkg=slopclient-cosmetics-linux-x64
          mkdir -p "$pkg" dist
          cp target/release/slopclient-cosmetics deploy/cosmetics/* "$pkg"/
          tar -czf "dist/$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: cosmetics-server
          path: dist/*
          if-no-files-found: error

  # Image of the cosmetics server; pushed to GHCR on tags, only built on manual runs.
  cosmetics-image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/slopclient-cosmetics
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        env:
          # Its build-record artifact breaks the download of all artifacts in the release job.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: deploy/cosmetics/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: [version, client-mod, launcher, cli, cosmetics-server, cosmetics-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${{ needs.version.outputs.version }}" '
            $0 == v {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Siehe [CHANGELOG.md](CHANGELOG.md)." > notes.md
      # Update manifest for the launcher updater, read from releases/latest/download/latest.json.
      - name: Updater manifest
        run: |
          v="${{ needs.version.outputs.version }}"
          exe="SlopClient_${v}_x64-setup.exe"
          [ -s "assets/$exe.sig" ] || { echo "::error::assets/$exe.sig is missing"; exit 1; }
          jq -n \
            --arg version "$v" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile sig "assets/$exe.sig" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$exe" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"windows-x86_64": {signature: ($sig | rtrimstr("\n")), url: $url}}}' \
            > assets/latest.json
          cat assets/latest.json
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "SlopClient ${{ needs.version.outputs.version }}" \
            --notes-file notes.md $pre
